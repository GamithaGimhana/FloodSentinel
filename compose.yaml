services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      CORS_ORIGINS: http://localhost:8080
      HTTP_TIMEOUT_SECONDS: 12
      HISTORY_DB_PATH: /app/runtime/assessments.sqlite3
    volumes:
      - assessment-history:/app/runtime
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  assessment-history:
